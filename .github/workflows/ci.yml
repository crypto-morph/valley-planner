name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand from the Actions tab to get a Windows .exe of main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync
      - run: uv run ruff check .
      # The game isn't on CI machines: tests that need it skip themselves
      - run: uv run pytest -q

  exe:
    # The single-file Windows build: only when asked for (releases build their own on a tag)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --group build
      - run: uv run pyinstaller --onefile --name valley-planner --collect-data valley_planner --collect-submodules uvicorn --paths src packaging/run.py
      - run: dist/valley-planner.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: valley-planner-windows
          path: dist/valley-planner.exe
